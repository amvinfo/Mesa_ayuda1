<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Mesa de Ayuda</title>
    <meta http-equiv="refresh" content="0;url=dist/index.html">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #0066B3 0%, #004A83 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        h1 { margin: 0 0 10px 0; font-size: 2.5em; }
        p { margin: 10px 0; opacity: 0.9; }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 Mesa de Ayuda</h1>
        <p>Redirigiendo al sitio...</p>
        <div class="spinner"></div>
        <p>Si no se redirige automáticamente, haz clic aquí:</p>
        <p><a href="dist/index.html">Abrir Mesa de Ayuda</a></p>
        <hr style="margin: 30px 0; opacity: 0.3;">
        <p style="font-size: 0.9em;">
            <strong>¿No funciona?</strong><br>
            Para una mejor experiencia, instala XAMPP y sigue las instrucciones en:<br>
            <code>INSTRUCCIONES.txt</code>
        </p>
    </div>
    <script>
        // Intentar abrir en diferentes puertos
        setTimeout(function() {
            window.location.href = 'dist/index.html';
        }, 1000);
    </script>
</body>
</html>
